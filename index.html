<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Scratch Card</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #044275;
      }
      #container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        position: absolute;
        border: 2px solid #000;
        touch-action: none; /* Prevent scrolling and zooming on touch */
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="imageCanvas" width="400" height="396"></canvas>
      <canvas id="scratchCanvas" width="400" height="396"></canvas>
    </div>

    <script>
      const imageCanvas = document.getElementById("imageCanvas");
      const scratchCanvas = document.getElementById("scratchCanvas");
      const imageCtx = imageCanvas.getContext("2d");
      const scratchCtx = scratchCanvas.getContext("2d");

      let isDrawing = false;

      function startDrawing(event) {
        if (event.type === "touchstart") {
          event.preventDefault();
        }
        isDrawing = true;
        scratchCtx.globalCompositeOperation = "destination-out";
        draw(event);
      }

      function stopDrawing(event) {
        if (event.type === "touchend") {
          event.preventDefault();
        }
        isDrawing = false;
        scratchCtx.beginPath();
      }

      function draw(event) {
        if (!isDrawing) return;

        let x, y;
        if (event.type === "touchmove" || event.type === "touchstart") {
          event.preventDefault(); // Prevent the default behavior
          x =
            event.touches[0].pageX - scratchCanvas.getBoundingClientRect().left;
          y =
            event.touches[0].pageY - scratchCanvas.getBoundingClientRect().top;
        } else {
          x = event.offsetX;
          y = event.offsetY;
        }

        scratchCtx.lineWidth = 20;
        scratchCtx.lineCap = "round";

        scratchCtx.lineTo(x, y);
        scratchCtx.stroke();
        scratchCtx.beginPath();
        scratchCtx.moveTo(x, y);
      }

      const image = new Image();
      image.src = "bloquinho.png";
      image.onload = function () {
        // Draw the image
        imageCtx.drawImage(
          image,
          0,
          0,
          imageCanvas.width,
          imageCanvas.height,
          0,
          0,
          imageCanvas.width,
          imageCanvas.height
        );

        // Cover the image with a gray mask
        scratchCtx.fillStyle = "#3f3e3e";
        scratchCtx.fillRect(0, 0, scratchCanvas.width, scratchCanvas.height);

        // Draw the prize text on top of the gray mask
        scratchCtx.font = "30px Arial";
        scratchCtx.fillStyle = "#ffffff";
        scratchCtx.fillText(
          "Raspe Aqui E Garanta O Seu Ingresso!",
          25,
          180,
          scratchCanvas.width - 50
        );
      };

      scratchCanvas.addEventListener("mousedown", startDrawing);
      scratchCanvas.addEventListener("mouseup", stopDrawing);
      scratchCanvas.addEventListener("mousemove", draw);
      scratchCanvas.addEventListener("touchstart", startDrawing, {
        passive: false,
      });
      scratchCanvas.addEventListener("touchend", stopDrawing, {
        passive: false,
      });
      scratchCanvas.addEventListener("touchmove", draw, { passive: false });
    </script>
  </body>
</html>
